<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="styles.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title> 2 Person Interaction Test </title>
</head>

<body>
	<div class="Head-Container">
		<div class="HeaderSub">
			<div class="Label" id="OutputLab">
			    Output:
			</div>
			<div class="Label" id="OutputLab2">
			    Output2:
			</div>
			<div class="Label" id="ErrorLab">
			    Errors:
			</div>
		</div>
	</div>
	<div class="Main-Container">
		<div class="Group" id = "CreateJoinCont">
			<div class="ButtonContainer">
				<button class="CreateButton" id="createBtn"> Create Game </button>
			</div>
			<div class="ButtonContainer">
				<div class="JoinTxtContainer">
					<input class="JoinTxt" type="text" id="joinTxt" placeholder="Enter Code">
					<button class="pasteJoinCodeBtn" id="pasteJoinCodeBtn">📋</button>
				</div>
				<div class="JoinBtn">
					<button class="JoinButton" id="joinBtn"> Join Game </button>
				</div>
			</div>
		</div>
		<div class="Group" id = "WaitForOpp" style = "Display: None">
			<div class="WaitLabel" id="waitLabel">
				Waiting for Opponent...
			</div>
		</div>
		<div class="Group" id = "OpponentLeft" style = "Display: None">
			<div class="LeftLabel" id="LeftLabel">
				Opponent Left...
			</div>
		</div>
		<div class="Group" id = "RPSSelect" style = "Display: None">
			<div class="gpTop" id="moveDisp">
				<div class="gpTopTop" id="myMove">
					
				</div>
				<div class="gpTopMid" id="oppMove">
					Opponent is choosing
				</div>
				<div class="gpTopBot" id="result">
					
				</div>

			</div>
			<div class="gpMid" id="scoreBoard">
				0 - 0
			</div>
			<div class="gpBot" id="selMove">
                <button class="moveButton" id="rockButton"> Rock </button>
                <button class="moveButton" id="paperButton"> Paper </button>
                <button class="moveButton" id="scissorsButton"> Scissors </button>
			</div>
			<div class="gpBot2" id="moveWaiting">
				
			</div>
			<div class="gpBot2" id="rematchBtn">
				<button class="remButton" id="remButton"> Rematch! </button>
			</div>
		</div>        
	</div>
	<div class="Foot-Container">
		<div class="FooterSub">
			<button class="disconnectBtn" id="disconnectBtn" disabled> Disconnect </button>
		</div>
	</div>
<script type="module" src="script.js"></script>

</body>
</html>
